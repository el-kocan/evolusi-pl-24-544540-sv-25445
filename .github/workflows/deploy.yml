name: Deploy

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            vendor/
            public/build/
          retention-days: 1

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies (Dev & Test)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run PHPUnit Tests
        run: php artisan test

  staging:
    name: staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging (Server Tiruan)
        run: |
          echo "Memulai deployment otomatis ke server staging (server tiruan)..."
          echo "Tempat mencoba fitur tanpa risiko ke production."
          echo "Deploy ke staging sukses!"

  production:
    name: production
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 1. Kunci pintu - tampilkan halaman pemeliharaan
        run: echo "php artisan down --retry=60"

      - name: 2. Ambil kode terbaru
        run: echo "git pull origin main"

      - name: 3. Pasang dependensi (tanpa paket dev)
        run: echo "composer install --no-dev --optimize-autoloader"

      - name: 4. Ubah skema basis data
        run: echo "php artisan migrate --force"

      - name: 5. Bangun ulang cache dengan kode & config baru
        run: |
          echo "php artisan config:cache"
          echo "php artisan route:cache"
          echo "php artisan view:cache"

      - name: 6. Muat ulang pekerja antrean
        run: echo "php artisan queue:restart"

      - name: 7. Buka pintu kembali
        run: echo "php artisan up"
